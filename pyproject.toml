[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jhb-dataclean"
version = "0.1.0"
description = "Data cleaning functions for pandas: columns, text, types, missing values, duplicates and outliers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Josue Hormiga" },
]
keywords = ["pandas", "data-cleaning", "dataframe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.2",
]

# Extras: pip install "jhb-dataclean[excel]", "[parquet]" o "[all]".
# Mínimos: openpyxl 3.1.5 lo exige pandas 3; pyarrow 13 da avisos con pandas 2.2
[project.optional-dependencies]
excel = ["openpyxl>=3.1.5"]
parquet = ["pyarrow>=14"]
all = ["jhb-dataclean[excel,parquet]"]

[project.urls]
Homepage = "https://github.com/josuehormigabenitez22-cmd/data-clean"
Issues = "https://github.com/josuehormigabenitez22-cmd/data-clean/issues"

# Lista blanca: el sdist solo lleva lo necesario para construir y probar el
# paquete, así no se cuela ningún archivo local que no esté en el repositorio
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
jhb-dataclean = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"
openpyxl = ">=3.1.5"
pyarrow = ">=14"

# Las versiones mínimas que promete el paquete, para probarlas en la CI
[tool.pixi.feature.min.dependencies]
python = "3.11.*"
pandas = "2.2.*"
openpyxl = "3.1.5.*"
pyarrow = "14.*"

[tool.pixi.environments]
default = ["dev"]
min = ["dev", "min"]

[tool.pixi.tasks]
test = "pytest"
doctest = "pytest --doctest-modules --doctest-glob=README.md src README.md"
lint = "ruff check ."
format = "ruff format ."

# ---------- Configuración de herramientas ----------

[tool.ruff]
line-length = 88
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",   # errores de estilo (pycodestyle)
    "W",   # avisos de estilo
    "F",   # errores reales: imports sin usar, nombres sin definir (pyflakes)
    "I",   # orden de los imports (isort)
    "B",   # bugs típicos (flake8-bugbear)
    "UP",  # sintaxis moderna de Python (pyupgrade)
    "PD",  # buenas prácticas de pandas
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Un warning (p. ej. un FutureWarning de pandas) hace fallar el test: así nos
# enteramos antes de que la próxima versión lo convierta en error
filterwarnings = ["error"]